name: projects

services:

# Janus # --------------------------------------------------------------------------------------------------------------

  janus:
    build: .
    image: janus:latest
    container_name: janus
    user: "1000:1000"
    cap_drop:
      - NET_RAW
    command: api
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@postgres:5432/janus
      - JANUS_INTERNAL_TOKEN=${JANUS_INTERNAL_TOKEN}
      - JANUS_PIHOLE_URL=http://192.168.1.220:1000
      - JANUS_PIHOLE_PASSWORD=${JANUS_PIHOLE_PASSWORD:-}
      - JANUS_GOTIFY_URL=${GOTIFY_HOST:+https://}${GOTIFY_HOST:-}
      - JANUS_GOTIFY_TOKEN=${JANUS_GOTIFY_TOKEN:-}
      - JANUS_SMTP_HOST=${SMTP_HOST:-}
      - JANUS_SMTP_PORT=465
      - JANUS_SMTP_SECURITY=${JANUS_SMTP_SECURITY:-ssl}
      - JANUS_SMTP_USER=${SMTP_NOREPLY_USER:-}
      - JANUS_SMTP_PASSWORD=${SMTP_NOREPLY_PASSWORD:-}
      - JANUS_SMTP_SENDER=${SMTP_NOREPLY_USER:-}
      - JANUS_NOTIFY_EMAIL=${JANUS_NOTIFY_EMAIL:-}
      - JANUS_SECRET_KEY=${JANUS_SECRET_KEY:-}
      - JANUS_DHCP_PROVIDER=${JANUS_DHCP_PROVIDER:-}
      - JANUS_DNS_PROVIDER=${JANUS_DNS_PROVIDER:-}
      - JANUS_UNIFI_URL=${JANUS_UNIFI_URL:-}
      - JANUS_UNIFI_USERNAME=${JANUS_UNIFI_USERNAME:-}
      - JANUS_UNIFI_PASSWORD=${JANUS_UNIFI_PASSWORD:-}
      - JANUS_GUEST_START=${JANUS_GUEST_START:-}
      - JANUS_GUEST_END=${JANUS_GUEST_END:-}
      - BACKEND_URL=http://127.0.0.1:8000
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://${JANUS_HOST}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-}
      - AUTH_AUTHENTIK_ID=${AUTH_AUTHENTIK_ID:-}
      - AUTH_AUTHENTIK_SECRET=${AUTH_AUTHENTIK_SECRET:-}
      - AUTH_AUTHENTIK_ISSUER=${AUTHENTIK_HOST:+https://}${AUTHENTIK_HOST:-}${AUTHENTIK_HOST:+/application/o/janus/}
      - JANUS_ALLOWED_EMAILS=${JANUS_ALLOWED_EMAILS:-}
      - JANUS_ADMIN_USERNAME=${JANUS_ADMIN_USERNAME:-}
      - JANUS_ADMIN_PASSWORD=${JANUS_ADMIN_PASSWORD:-}
      - TZ=Europe/Rome
    volumes:
      - ./janus/backups:/app/backups
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.janus-router.rule=Host(`${JANUS_HOST}`)"
      - "traefik.http.routers.janus-router.entrypoints=web"
      - "traefik.http.services.janus-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.janus-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.janus-router.middlewares=janus-https"
    networks:
      - proxy_public
      - db_internal

# Janus Worker # ---------------------------------------------------------------------------------------------------------

  janus-worker:
    image: janus:latest
    container_name: janus-worker
    user: "1000:1000"
    cap_drop:
      - NET_RAW
    depends_on:
      janus:
        condition: service_healthy
    command: worker
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@postgres:5432/janus
      - JANUS_PIHOLE_URL=http://192.168.1.220:1000
      - JANUS_PIHOLE_PASSWORD=${JANUS_PIHOLE_PASSWORD:-}
      - JANUS_SYNC_MODE=dry-run
      - JANUS_REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/3
      - JANUS_GOTIFY_URL=${GOTIFY_HOST:+https://}${GOTIFY_HOST:-}
      - JANUS_GOTIFY_TOKEN=${JANUS_GOTIFY_TOKEN:-}
      - JANUS_SMTP_HOST=${SMTP_HOST:-}
      - JANUS_SMTP_PORT=465
      - JANUS_SMTP_SECURITY=${JANUS_SMTP_SECURITY:-ssl}
      - JANUS_SMTP_USER=${SMTP_NOREPLY_USER:-}
      - JANUS_SMTP_PASSWORD=${SMTP_NOREPLY_PASSWORD:-}
      - JANUS_SMTP_SENDER=${SMTP_NOREPLY_USER:-}
      - JANUS_NOTIFY_EMAIL=${JANUS_NOTIFY_EMAIL:-}
      - JANUS_INTERNAL_TOKEN=${JANUS_INTERNAL_TOKEN}
      - JANUS_SECRET_KEY=${JANUS_SECRET_KEY:-}
      - JANUS_DHCP_PROVIDER=${JANUS_DHCP_PROVIDER:-}
      - JANUS_DNS_PROVIDER=${JANUS_DNS_PROVIDER:-}
      - JANUS_UNIFI_URL=${JANUS_UNIFI_URL:-}
      - JANUS_UNIFI_USERNAME=${JANUS_UNIFI_USERNAME:-}
      - JANUS_UNIFI_PASSWORD=${JANUS_UNIFI_PASSWORD:-}
      - JANUS_GUEST_START=${JANUS_GUEST_START:-}
      - JANUS_GUEST_END=${JANUS_GUEST_END:-}
      - TZ=Europe/Rome
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/janus-worker.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/janus-worker.heartbeat) )) -lt 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
    networks:
      - db_internal
      - mail_internal
      - metrics_internal

# Janus Sentinel # -------------------------------------------------------------------------------------------------------

  janus-sentinel:
    image: janus:latest
    container_name: janus-sentinel
    user: "1000:1000"
    network_mode: host
    depends_on:
      janus:
        condition: service_healthy
    command: sentinel
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@127.0.0.1:5432/janus
      - JANUS_SENTINEL_INTERFACE=enp5s0
      - TZ=Europe/Rome
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/janus-sentinel.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/janus-sentinel.heartbeat) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

# Janus Scanner # --------------------------------------------------------------------------------------------------------

  janus-scanner:
    image: janus:latest
    container_name: janus-scanner
    user: "1000:1000"
    cap_drop:
      - NET_RAW
    depends_on:
      janus:
        condition: service_healthy
    command: scanner
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@postgres:5432/janus
      - TZ=Europe/Rome
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/janus-scanner.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/janus-scanner.heartbeat) )) -lt 600"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
    networks:
      - db_internal

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
  metrics_internal:
    external: true
